# Fábrica do APK Android do SPECIAL CLINIC: compila, assina e publica no site
# (https://special-clinic.web.app/SpecialClinic.apk) junto com o versao-apk-clinic.json —
# o aviso "Nova atualização" dentro do app dos dentistas aponta pra cá.
#
# VERSÃO: como o disparo manual não funciona fora da main, a versão vem das
# variáveis abaixo (env). Pra lançar uma versão nova: edite VERSAO/CODIGO/NOVIDADES
# e faça push — o push deste arquivo dispara a fábrica sozinho.
# Assinatura: a MESMA chave do Lab (cofre/lab-ci.keystore.enc).
name: APK Clinic → Site

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apk-clinic.yml

env:
  VERSAO: "9.2"
  CODIGO: "1"
  NOVIDADES: "Primeira versão Android do Special Clinic: acompanhe seus trabalhos, saldo com o laboratório e atualização dentro do app."

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Abre o keystore do cofre
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Falta o segredo FIREBASE_SERVICE_ACCOUNT."
            exit 1
          fi
          if [ ! -f cofre/lab-ci.keystore.enc ]; then
            echo "::error::Cofre não encontrado (cofre/lab-ci.keystore.enc) — rode a fábrica do Lab uma vez."
            exit 1
          fi
          CHAVE=$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | sha256sum | cut -c1-64)
          echo "::add-mask::$CHAVE"
          echo "LAB_KS_SENHA=$CHAVE" >> "$GITHUB_ENV"
          echo "LAB_KS_ARQUIVO=$RUNNER_TEMP/lab-ci.keystore" >> "$GITHUB_ENV"
          openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$CHAVE" \
            -in cofre/lab-ci.keystore.enc -out "$RUNNER_TEMP/lab-ci.keystore"
          echo "Keystore do cofre aberto ✓"

      - name: Instala dependências e gera o pacote web do Clinic
        run: |
          npm ci
          node build-ios-clinic.mjs
          cd clinic-native
          npm ci
          npx cap sync android

      - name: Garante o app Android do Clinic no Firebase (google-services.json)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          node obter-android-clinic.mjs

      - name: Compila e assina o APK
        env:
          CLINIC_VERSION_CODE: ${{ env.CODIGO }}
          CLINIC_VERSION_NAME: ${{ env.VERSAO }}
        run: |
          cd clinic-native/android
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleRelease --no-daemon || java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleRelease --no-daemon
          ls -la app/build/outputs/apk/release/

      - name: Registra a impressão digital (SHA) do app no Firebase (login Google)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          SAIDA=$(keytool -list -v -keystore "$LAB_KS_ARQUIVO" -alias labspecial -storepass "$LAB_KS_SENHA" 2>/dev/null)
          SHA1=$(echo "$SAIDA" | grep -i "SHA1:" | head -1 | sed 's/.*SHA1: *//')
          SHA256=$(echo "$SAIDA" | grep -i "SHA256:" | head -1 | sed 's/.*SHA256: *//')
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          SHA1_APP="$SHA1" SHA256_APP="$SHA256" ANDROID_APP_ID="$CLINIC_ANDROID_APP_ID" node registrar-sha-android.mjs || echo "::warning::Não consegui registrar a SHA (o build segue mesmo assim)."

      - name: Publica o APK e o aviso de atualização no site
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          cp clinic-native/android/app/build/outputs/apk/release/app-release.apk dist-clinic/SpecialClinic.apk
          node -e "
            const fs = require('fs');
            fs.writeFileSync('dist-clinic/versao-apk-clinic.json', JSON.stringify({
              versionCode: parseInt(process.env.CODIGO, 10),
              versionName: process.env.VERSAO,
              url: 'https://special-clinic.web.app/SpecialClinic.apk',
              novidades: process.env.NOVIDADES || '',
            }, null, 2));
          "
          npx firebase-tools deploy --only hosting:clinic --project laboratorio-special --non-interactive --force
          echo "APK Clinic ${VERSAO} (código ${CODIGO}) publicado ✓"

      - name: Guarda o versao-apk-clinic.json no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist-clinic/versao-apk-clinic.json
          git diff --cached --quiet || git commit -m "APK Clinic ${VERSAO} publicado (versao-apk-clinic.json)"
          git pull --rebase --autostash || true
          git push || true
