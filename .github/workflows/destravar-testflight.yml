name: Destravar TestFlight
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/destravar-testflight.yml
      - destravar-testflight.mjs
      - ligar-interna.mjs
env:
  EMAILS: "ds213328@gmail.com"
  BUNDLE: "com.laboratorio.special"
jobs:
  destravar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: node destravar-testflight.mjs && node ligar-interna.mjs

