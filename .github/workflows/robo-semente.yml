# Robô geral do projeto Seja Semente: roda qualquer script da pasta
# seja-semente/ com as credenciais da Apple e do Firebase disponíveis.
# Rodar: aba Actions → "Robô Seja Semente" → Run workflow (escolha o script).
name: Robô Seja Semente

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script a rodar (ex.: seja-semente/criar-firebase.mjs)'
        required: true
        default: 'seja-semente/checar-apps.mjs'
      modo:
        description: 'MODO do script (ex.: conferir ou enviar)'
        required: false
        default: ''
      app:
        description: 'APP do script (central|semeador|palmar|colheita|todos)'
        required: false
        default: ''

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Roda o script
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          MODO: ${{ github.event.inputs.modo }}
          APP: ${{ github.event.inputs.app }}
        run: node ${{ github.event.inputs.script }}
