# Fica tentando mandar os quatro para a análise da App Store, de hora em hora.
#
# Existe porque a última coisa que falta — a declaração de privacidade da
# loja — só dá para preencher no site da Apple, e não dá para saber pela API
# quando foi preenchida. Então, em vez de alguém ficar olhando, o robô tenta
# sozinho: no minuto em que destravar, ele manda.
#
# Ele NÃO manda nada incompleto: confere tudo antes e desiste em silêncio se
# faltar alguma coisa. Quando os quatro já tiverem sido enviados, cada volta
# só diz "nada a enviar".
name: Tentar enviar para a análise

# Os quatro já foram enviados. O relógio de hora em hora foi desligado de
# propósito: se a Apple recusar uma versão, este robô NÃO deve reenviá-la
# sozinho sem a correção — reenvio de versão recusada, igualzinha, é
# reprovação em dobro. Fica só o botão manual.
on:
  workflow_dispatch:

jobs:
  tentar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tenta mandar
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MODO_ESPERA: '1'
        run: node seja-semente/enviar-analise.mjs
